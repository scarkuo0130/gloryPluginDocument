<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ID 大卡 · 元件對位 demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #090b13 0%, #142133 30%, #24192e 70%, #0b101c 100%);
    color: #fff; min-height: 100vh;
  }
  h1 { color: #ffd166; font-size: 20px; margin: 0 0 4px; }
  .hint { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 20px; }
  .tiers { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tiers button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; cursor: pointer;
  }
  .tiers button.active { background: #ffd166; color: #1a1208; font-weight: 700; }

  .compare { display: grid; gap: 26px; max-width: 700px; }
  .block-label { font-size: 12px; color: #9fd1ff; margin-bottom: 8px; }

  /* ===== 卡舞台：655×326 比例，元件以 % 絕對定位，字級用 cqw（綁卡寬） ===== */
  .idcard {
    position: relative; width: 100%; aspect-ratio: 655 / 326;
    container-type: inline-size;
    filter: drop-shadow(0 16px 40px rgba(0,0,0,0.45));
  }
  .idcard .frame { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .idcard .layer { position: absolute; }
  /* 文字暫用普通白字 + 描邊（字體下階段再處理） */
  .idcard .txt { color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.7); white-space: nowrap; line-height: 1; }

  /* 頭像（含底部等級盾，等級數字疊上去） */
  .av-wrap { left: 0%; top: 3%; height: 80%; aspect-ratio: 181/196; }
  .av-wrap img { width: 100%; height: 100%; display: block; }
  .level { left: 50%; top: 84%; transform: translate(-50%,-50%); font-size: 4cqw; font-weight: 800; }

  /* 徽章（右上榮譽章） */
  .badge { right: 1.5%; top: 5%; width: 12.5%; aspect-ratio: 78/81; }
  .badge img { width: 100%; height: 100%; display: block; }

  /* 名字 */
  .name { left: 31%; top: 38%; font-size: 6.8cqw; font-weight: 800; }
  /* 成就星 + 數字 */
  .star { left: 65%; top: 37%; width: 8%; aspect-ratio: 59/57; }
  .star img { width: 100%; height: 100%; display: block; }
  .star .n { position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); font-size: 3.4cqw; font-weight: 800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  /* 編輯鈕 */
  .edit { left: 74.5%; top: 40%; width: 5%; aspect-ratio: 33/35; }
  .edit img { width: 100%; height: 100%; display: block; }
  /* ID */
  .id { left: 30.5%; top: 57%; font-size: 3.2cqw; opacity: 0.95; }
  /* VIP */
  .vip { left: 6%; top: 80%; width: 10%; aspect-ratio: 55/32; }
  .vip img { width: 100%; height: 100%; display: block; }
  /* 經驗值文字（無 bar） */
  .exp { right: 4%; top: 63%; font-size: 4cqw; font-weight: 700; }
  /* Next 底條 */
  .next { left: 28%; top: 90%; font-size: 3.2cqw; opacity: 0.92; }

  .ref img { width: 100%; display: block; border-radius: 10px; }
</style>
</head>
<body>
  <h1>ID 大卡 · 元件對位 demo</h1>
  <div class="hint">依 id_diamond 版面把元件擺上乾淨底框（稱號已去除、font 下階段處理）。切換階級看底框替換。</div>

  <div class="tiers">
    <button data-tier="default">預設</button>
    <button data-tier="bronze">銅</button>
    <button data-tier="silver">銀</button>
    <button data-tier="gold">金</button>
    <button data-tier="diamond" class="active">鑽石</button>
  </div>

  <div class="compare">
    <div>
      <div class="block-label">重建卡（底框 + 元件 + HTML 文字）</div>
      <div class="idcard" id="card">
        <img class="frame" id="frame" src="assets/idcard/frame_diamond.png" alt="底框" />
        <div class="layer av-wrap">
          <img src="assets/idcard/avatar_custom.png" alt="頭像" />
          <div class="layer txt level">1</div>
        </div>
        <div class="layer badge"><img src="assets/idcard/badge.png" alt="徽章" /></div>
        <div class="layer txt name">Louis5566</div>
        <div class="layer star"><img src="assets/idcard/ach_star.png" alt="成就星" /><span class="n">5</span></div>
        <div class="layer edit"><img src="assets/idcard/edit_btn.png" alt="編輯" /></div>
        <div class="layer txt id">ID 18145200</div>
        <div class="layer vip"><img src="assets/idcard/vip.png" alt="VIP" /></div>
        <div class="layer txt exp">1688 / 2000</div>
        <div class="layer txt next">Next 解鎖 5 個機台、新頭像、新背板</div>
      </div>
    </div>

    <div class="ref">
      <div class="block-label">參考：id_diamond（原始 baked 版）</div>
      <img src="assets/idcard/_ref_id_diamond.png" alt="參考" />
    </div>
  </div>

  <script>
    const frame = document.getElementById('frame');
    document.querySelectorAll('.tiers button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tiers button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        frame.src = `assets/idcard/frame_${b.dataset.tier}.png`;
      });
    });
  </script>
</body>
</html>
